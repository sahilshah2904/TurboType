name: Check TurboType
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure reliable Ubuntu package downloads
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo tee /etc/apt/apt.conf.d/80-turbotype-network > /dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - run: npm run check
